# LurnStack React SPA fallback for Nginx / aaPanel.
#
# Add this rule inside the `server { ... }` block for lurnstack.com.
# It prevents refresh/direct-open 404 errors for React Router pages like:
# /login, /signup, /dashboard, /courses, /live-classes, /checkout
#
# Keep api.lurnstack.com in a separate site/server block.

location / {
    try_files $uri $uri/ /index.html;
}

